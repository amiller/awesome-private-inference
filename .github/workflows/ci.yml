name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install deps
        run: |
          uv sync --frozen --python 3.11 --extra dev --extra nearai

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest

  site-quality:
    runs-on: ubuntu-latest
    # Reported, not gating, until the audit backlog clears R9 (backlog 104, newest record 74 days old).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install deps
        run: |
          uv sync --frozen --python 3.11 --extra dev

      - name: Site-quality rubric (R1-R4, R6, R7, R9)
        run: |
          source .venv/bin/activate
          python -m probes.rubric
