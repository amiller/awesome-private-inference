[project]
name = "awesome-private-inference"
version = "0.1.0"
description = "Public automated registry of TEE-verified inference providers"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew Miller" }]
dependencies = [
    "requests>=2.31",
    "eth-keys>=0.5",
    "eth-hash[pycryptodome]>=0.5",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "cryptography>=42",
    "sigstore>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
nearai = ["dcap-qvl>=0.2"]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifiers", "probes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
